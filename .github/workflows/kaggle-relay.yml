name: 24/7 Cloud Engine Relay (Kaggle)

on:
  schedule:
    - cron: '0 */8 * * *' # Auto-triggers every 8 hours (well before 12h limit)
  workflow_dispatch:        # Manual trigger button anytime

jobs:
  launch-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Configure Kaggle Credentials
        env:
          KAGGLE_API_TOKEN: KGAT_ead1857a27420ee626ebf25f4b19b792
          KAGGLE_USERNAME: alisain12
          KAGGLE_KEY: KGAT_ead1857a27420ee626ebf25f4b19b792
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"alisain12","key":"KGAT_ead1857a27420ee626ebf25f4b19b792"}' > ~/.kaggle/kaggle.json
          echo "KGAT_ead1857a27420ee626ebf25f4b19b792" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/kaggle.json ~/.kaggle/access_token

      - name: Deploy & Start Cloud Engine on Kaggle
        env:
          KAGGLE_API_TOKEN: KGAT_ead1857a27420ee626ebf25f4b19b792
          KAGGLE_USERNAME: alisain12
          KAGGLE_KEY: KGAT_ead1857a27420ee626ebf25f4b19b792
        run: |
          kaggle kernels push -p .
          echo "✅ Cloud Engine successfully deployed and launched on Kaggle!"
